<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 拼豆图纸助手</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
<div id="login-mask" class="login-mask hidden">
  <div class="login-box">
    <h2>管理员登录</h2>
    <input id="admin-account" placeholder="用户名/邮箱/手机号">
    <input id="admin-password" type="password" placeholder="密码">
    <div class="captcha-row"><input id="admin-captcha" placeholder="验证码"><div id="admin-captcha-img" class="captcha-img" title="点击刷新"></div></div>
    <button id="admin-login-btn" class="primary-btn">登 录</button>
    <div id="admin-login-msg" class="form-msg"></div>
  </div>
</div>

<div id="admin-app" class="admin-app hidden">
  <aside class="side">
    <div class="side-logo">🧩 拼豆图纸助手<br><small>管理后台</small></div>
    <nav id="admin-nav">
      <a data-page="dashboard" class="active">数据概览</a>
      <a data-page="patterns">图纸管理</a>
      <a data-page="categories">分类管理</a>
      <a data-page="users">用户管理</a>
      <a data-page="comments">评论管理</a>
      <a data-page="bans">封禁管理</a>
      <a data-page="notices">公告管理</a>
      <a data-page="orders">金币订单</a>
      <a data-page="coupons">优惠码 / 激活码</a>
      <a data-page="settings">主题设置</a>
      <a data-page="maintenance">维护模式</a>
      <a data-page="files">文件下载</a>
    </nav>
    <div class="side-bottom"><a href="/" target="_blank">↗ 打开前台</a></div>
  </aside>
  <main class="main" id="admin-main"></main>
</div>

<script src="/assets/js/admin.js"></script>
</body>
</html>
