<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件下载</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/assets/css/index.css">
<style>
.wrap{max-width:820px;margin:0 auto;padding:30px 20px 60px}
.panel{background:#fff;border:1px solid #e8ebf3;border-radius:18px;padding:26px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 10px;border-bottom:1px solid #eef1f7;text-align:left}
th{color:#8a90a2;font-size:13px}
</style>
</head>
<body>
<header id="topbar">
  <div class="bar-left"><a class="logo" href="/">🧩 <span id="site-name">拼豆图纸助手</span></a></div>
  <div class="bar-right">
    <div id="user-chip" class="hidden"><a href="/profile" class="user-btn" id="username-link"></a><a href="/" id="logout-btn" class="ghost-btn">退出</a></div>
    <div id="guest-chip"><a href="/login" class="user-btn">登录 / 注册</a></div>
  </div>
</header>
<div class="wrap">
  <div class="panel">
    <h2 style="margin-bottom:18px">📦 文件下载</h2>
    <table id="tb-files"><thead><tr><th>文件名</th><th>标题</th><th>大小</th><th>时间</th><th>操作</th></tr></thead><tbody></tbody></table>
    <p id="empty-tip" class="empty-tip hidden">暂无可下载文件</p>
  </div>
</div>
<script src="/assets/js/common.js"></script>
<script>
(async () => {
  await loadCommon();
  const r = await API('/files');
  const tb = document.querySelector('#tb-files tbody');
  if (r.ok && r.list.length) {
    tb.innerHTML = r.list.map(f => `<tr><td>${esc(f.filename)}</td><td>${esc(f.title)}</td><td>${(f.size / 1024).toFixed(1)} KB</td><td>${fmtTime(f.uploaded_at)}</td><td><a class="user-btn" href="${esc(f.url)}" download>下载</a></td></tr>`).join('');
  } else {
    document.getElementById('empty-tip').classList.remove('hidden');
    document.getElementById('tb-files').style.display = 'none';
  }
})();
</script>
</body>
</html>
