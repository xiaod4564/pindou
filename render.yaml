services:
  - type: web
    name: pindou
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pindou-db
          property: connectionString
databases:
  - name: pindou-db
    plan: free
    region: singapore
    databaseName: pindou
